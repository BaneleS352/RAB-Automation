<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RAB Automation{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="brand">
                <span class="brand-icon">RAB</span>
                <span>RAB Monitor</span>
            </a>
            <ul class="nav-links">
                <li><a href="/dashboard/health">Overview</a></li>
                <li><a href="/dashboard/records">Audit Records</a></li>
                <li><a href="/dashboard/tools">Tools</a></li>
                <li><a class="nav-btn" href="/dashboard/test">Run Tests</a></li>
            </ul>
        </div>
    </nav>
    <main class="container" style="padding-bottom: 2.5rem;">
        {% block content %}{% endblock %}
    </main>
    <footer style="border-top:1px solid var(--border); padding:1.25rem 0; margin-top:1rem; color:var(--muted); font-size:0.8rem;">
        <div class="container" style="display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
            <span>RAB Issue Monitor — Jira webhook monitor • approvals in Jira</span>
            <span>Demo populates pipeline summary • <a href="/dashboard/demo">Try demo</a> • <a href="/health">/health</a></span>
        </div>
    </footer>
</body>
</html>
